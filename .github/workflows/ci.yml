name: CI

# Runs on every pull request into main. Both jobs are required status checks
# on main (see the "main" ruleset), so a PR can't merge until they pass.
# Needs no secrets and no database: Storybook runs against mocked data.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: |
          bunx next typegen
          bun run typecheck
          bun run lint

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Stories import the pages, so typegen must run for PageProps types.
      - name: Generate route types
        run: bunx next typegen

      - name: Build Storybook
        run: bun run build-storybook --quiet

      # Every story renders in headless Chromium: it must not throw, its play
      # function must pass, and it must meet WCAG 2.2 A/AA.
      - name: Test stories
        run: bun run test:storybook

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
          if-no-files-found: ignore
