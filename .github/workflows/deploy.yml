name: Deploy

# Every merge to main: typecheck and lint, apply pending Drizzle migrations to
# the production Postgres (Neon), then build and deploy to Vercel production.
# Deploys never overlap; a second push while one is running waits for it.
#
# Secrets (repository → Settings → Secrets → Actions):
#   VERCEL_TOKEN        a Vercel access token scoped to the team
#   VERCEL_ORG_ID       from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   from .vercel/project.json after `vercel link`
# DATABASE_URL and the auth secrets live in the Vercel project's production
# environment; `vercel pull` fetches them, and the migration step reads the
# pulled file so the database URL is kept in one place.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel production environment
        run: bunx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Typecheck and lint
        run: |
          bunx next typegen
          bun run typecheck
          bun run lint

      - name: Apply database migrations
        # Migrations use the direct (non-pooled) connection; the app's own
        # DATABASE_URL points at Neon's pooler.
        run: bun --env-file=.vercel/.env.production.local run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Build
        run: bunx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url="$(bunx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
